name: CI Test Suite

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build & Verify (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4', '4.0']

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Validate RubyGem Specification
        run: |
          gem build bilingual-jekyll-resume-theme.gemspec
          rm -f bilingual-jekyll-resume-theme-*.gem

      - name: Build Jekyll Site with Strict Checks
        run: |
          bundle exec jekyll build --config docs/_data/_config.sample.yml,docs/_data/_config.demo.yml --strict_front_matter --trace

      - name: Verify Built HTML (dead links, anchors, images, hreflang)
        run: |
          bundle exec rake proof

      - name: Static Analysis (RuboCop)
        run: |
          bundle exec rake rubocop

      - name: Validate Resume Data Schemas & Parity
        run: |
          chmod +x bin/validate-resume
          ./bin/validate-resume docs/_data --fail-on-warnings
          bundle exec rake validate[docs/_data]

      - name: Run Test Suite
        run: |
          bundle exec rake test
