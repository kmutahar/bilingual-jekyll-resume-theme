{%- comment -%}
=============================================================================
ANALYTICS BODY SNIPPET (GTM NOSCRIPT FALLBACK)
=============================================================================
Purpose:
  Renders the Google Tag Manager <noscript> fallback iframe immediately after
  the opening <body> tag. If GTM is not configured, this include renders
  nothing.

Configuration (in _config.yml):
  analytics:
    gtm: "GTM-XXXXXXX"

Usage:
  {% include analytics-body.html %}
=============================================================================
{%- endcomment -%}

{%- if site.analytics.gtm -%}

    <!-- Google Tag Manager (noscript fallback) -->
    <noscript>
        <iframe
            src="https://www.googletagmanager.com/ns.html?id={{ site.analytics.gtm | escape }}"
            height="0"
            width="0"
            style="display:none;visibility:hidden">
        </iframe>
    </noscript>
    <!-- End Google Tag Manager (noscript) -->

{%- elsif site.analytics.gtag or site.analytics.ga -%}

    {%- comment -%}
    Google Analytics (gtag.js) operates entirely in <head>; no body snippet is required.
    {%- endcomment -%}

{%- else -%}

    <!-- No Analytics Configured -->

{%- endif -%}
