# Demo build overlay
# File: docs/_data/_config.demo.yml
#
# The theme repository has no resume pages of its own; the six-language Sherlock
# Holmes demo lives under docs/demo/ and its data under docs/_data/<lang>/.
# Jekyll's default data_dir is `_data` at the site source root, so this overlay
# points it at docs/_data instead, letting the demo render from this repo.
#
# Build with:
#   bundle exec jekyll build --config docs/_data/_config.sample.yml,docs/_data/_config.demo.yml
#
# Jekyll deep-merges multiple --config files, so only the Sherlock Holmes persona
# fields that differ from the generic _config.sample.yml placeholders need to be
# listed here; data_path/url/header_intro are structural and stay in the sample.

data_dir: docs/_data

title: "Sherlock Holmes"
description: "Consulting Detective, 221B Baker Street, London"

contact_info:
  email: "sherlock@example.com"

social_links:
  email: "sherlock@example.com"

