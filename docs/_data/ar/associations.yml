# العضويات
# الملف: _data/ar/associations.yml
# العضويات المهنية ومجموعات العمل والجمعيات التخصصية
#
# ملاحظات المخطط:
# - `organization`: اسم الجمعية المهنية أو المنظمة.
# - `role`: مستوى العضوية أو المنصب القيادي.
# - `year`: الفترة الزمنية (تدعم &ndash; للفواصل الزمنية).
# - `url`: رابط اختياري للموقع الرسمي (يظهر كرابط وفي وضع الطباعة).
# - `summary`: وصف اختياري للمساهمات وأعمال الإدارة.
# - `active`: اضبط على false لاستبعاد العضوية من السيرة الذاتية.

# عضوية مع رابط
- organization: "نادي ديوجين"
  active: true
  role: "عضو ضيف (عبر شقيقه مايكروفت هولمز)"
  year: "1888 &ndash; حتى الآن"
  url: "https://example.com/diogenes-club"
  summary: >-
    ضيف بين الحين والآخر على أكثر أندية لندن انعزالاً، حيث يُفرض الصمت بموجب قواعد النادي، ويحتفظ مايكروفت هولمز بمقعد دائم بجانب النافذة.

# عضوية بدون رابط
- organization: "الجمعية الكيميائية بلندن"
  active: true
  role: "عضو مراسل"
