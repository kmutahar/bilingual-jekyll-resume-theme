# العضويات
# الملف: _data/ar/associations.yml
# العضويات المهنية ومجموعات العمل والجمعيات التخصصية
#
# ملاحظات المخطط:
# - `organization`: اسم الجمعية المهنية أو المنظمة.
# - `role`: مستوى العضوية أو المنصب القيادي.
# - `year`: الفترة الزمنية (تدعم &ndash; للفواصل الزمنية).
# - `url`: رابط اختياري للموقع الرسمي (يظهر كرابط وفي وضع الطباعة).
# - `summary`: وصف اختياري للمساهمات وأعمال الإدارة.
# - `active`: اضبط على false لاستبعاد العضوية من السيرة الذاتية.

