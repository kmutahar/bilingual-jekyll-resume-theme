# الشهادات والتراخيص
# الملف: _data/ar/certifications.yml
# الشهادات والتراخيص المهنية
#
# ملاحظات المخطط:
# - `name`: مسمى الشهادة (يدعم كيانات HTML مثل &ndash;).
# - `issuing_organization`: المنظمة المانحة للاعتماد.
# - `credential_id`: معرّف أو رقم الاعتماد الاختياري.
# - `credential_url`: رابط التحقق الاختياري الذي يربط معرّف الاعتماد.
# - `issue_date`: تاريخ الإصدار الإلزامي بتنسيق ISO (YYYY-MM-DD).
# - `expiration`: تاريخ الانتهاء الاختياري بتنسيق ISO (يُترك فارغاً للشهادات الدائمة).
# - `courses`: مصفوفة دورات متداخلة اختيارية للسجلات الشخصية (لا تُعرض نهائياً في السيرة).
# - `active`: اضبط على false لاستبعاد السجل من العرض في السيرة الذاتية.

