# الدورات
# الملف: _data/ar/courses.yml
# الدورات التدريبية وورش العمل والبرامج التنفيذية
#
# ملاحظات المخطط:
# - `name`: مسمى الدورة (يدعم كيانات HTML).
# - `issuing_organization`: المنصة أو المؤسسة الأكاديمية المقدمة للدورة.
# - `credential_id`: معرّف أو رقم إتمام الدورة الاختياري.
# - `credential_url`: رابط التحقق الاختياري.
# - `startdate`: تاريخ البداية الإلزامي (بتنسيق YYYY-MM-DD).
# - `enddate`: تاريخ الإتمام الاختياري (بتنسيق YYYY-MM-DD).
# - `summary`: وصف تفصيلي لمحتوى الدورة (يُعرض عند ضبط `enable_summary: true`).
# - `active`: اضبط على false لحجب الدورة من السيرة الذاتية.

