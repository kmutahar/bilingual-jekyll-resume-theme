# التعليم
# الملف: _data/ar/education.yml
# الشهادات الأكاديمية والخلفية التعليمية
#
# ملاحظات المخطط:
# - `uni`: اسم الجامعة أو المؤسسة الأكاديمية.
# - `degree`: عنوان الدرجة العلمية والتخصص.
# - `year`: الفترة الزمنية المعروضة (مع استخدام &ndash; للفواصل الزمنية).
# - `location`: موقع المؤسسة الأكاديمية.
# - `awards`: مصفوفة اختيارية للجوائز ومراتب الشرف.
# - `award`: نص اختياري لجائزة واحدة (يمكن استخدامه منفرداً أو إلى جانب قائمة الجوائز).
# - `summary`: فقرة وصفية تستعرض الأطروحة أو المواد التخصصية.
# - `active`: اضبط على false للاحتفاظ بالسجل دون عرضه في السيرة الذاتية.

# الفترة الجامعية (لم تحدد الروايات الأصلية اسم المؤسسة)
- degree: "دراسة جامعية أولية في الكيمياء والعلوم الطبيعية"
  uni: "جامعة (لم يوثّق اسم المؤسسة في السجلات المتبقية)"
  year: "1872 &ndash; 1876"
  location: "إنجلترا"
  active: true
  summary: >-
    ركّز على الكيمياء العضوية، والتشريح، والأدبيات المثيرة المتعلقة بالجريمة، مع إهمال عام للمنهج الدراسي التقليدي. أمضى عامين في غرف الجامعة قبل الانتقال إلى لندن لبدء ممارسته المستقلة.

# دراسة مخبرية خاصة في مستشفى بارت، حيث بدأت الشراكة مع واطسون
- degree: "دراسة خاصة في الكيمياء التحليلية والجنائية"
  uni: "مختبرات مستشفى القديس بارثولوميو"
  year: "1877 &ndash; 1881"
  location: "لندن، إنجلترا"
  active: true
  award: "ابتكر كاشفاً كيميائياً للكشف عن بقع الهيموغلوبين، لا يترسب بأي مادة أخرى"
  summary: >-
    بحث مخبري مستقل في الكشف عن الدماء، والسموم، والتحليل الكيميائي للآثار الجنائية الدقيقة، أُجري بالتوازي مع بعض القضايا العرضية. وفي هذه المختبرات بدأت شراكته مع الدكتور جون هـ. واطسون.

