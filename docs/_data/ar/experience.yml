  durations:
    - duration: "1881 &ndash; 1888"
    - duration: "&amp; 1894 &ndash; حتى الآن"
  location: "لندن، إنجلترا"
  active: true
  notes: "بصفة غير رسمية، بناءً على طلب شخصي من المفتشين ليستريد وغريغسون وأثيلني جونز"
  summary: >-
    يقدم المشورة في القضايا التي تتجاوز الاختصاص الاعتيادي للشرطة الرسمية، بما في ذلك جرائم القتل والابتزاز وقضايا أمن الدولة. يُنسب إليه سراً حل العديد من القضايا المعلنة رسمياً بوصفها محلولة من قبل الشرطة.

