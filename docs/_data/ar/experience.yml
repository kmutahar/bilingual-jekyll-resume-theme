# الخبرة المهنية وسجل التوظيف
#
# ملاحظات المخطط:
# - يتم تجميع الأدوار حسب اسم الشركة (company)؛ تظهر المناصب المتعددة لدى نفس جهة العمل معاً.
# - تُرتب المناصب داخل الشركة الواحدة حسب تاريخ البدء (startdate) من الأحدث إلى الأقدم.
# - تستخدم المناصب المستمرة تواريخ ISO (startdate: YYYY-MM-DD، و enddate: YYYY-MM-DD أو enddate: "حتى الآن").
# - تستخدم الفترات غير المتصلة مصفوفة الفترات durations مع كيانات HTML (&ndash;، &amp;).
# - الخيار `active: false` يحفظ السجلات التاريخية أو المسودات دون عرضها على الموقع.

# الممارسة المستقلة (الحالية)
- company: "٢٢١ب شارع بيكر، الممارسة المستقلة"
  position: "محقق استشاري"
  startdate: 1881-01-01
  enddate: "حتى الآن"
  location: "لندن، إنجلترا"
  active: true
  notes: "المحقق الاستشاري الوحيد الممارس لهذه المهنة"
  summary: >-
    أسّس مهنة المحقق الاستشاري. يتولى التحقيق في القضايا المحالة من العملاء الخاصين، وأجهزة الشرطة الرسمية، والحكومات الأجنبية، معتمداً على الملاحظة المنهجية والاستدلال الاستنتاجي حيثما أخفقت أساليب التحقيق التقليدية.

