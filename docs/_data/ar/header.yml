# نبذة رأس الصفحة
# الملف: _data/ar/header.yml
# يحتوي هذا الملف على الملخص التنفيذي/فقرة المقدمة التي تظهر أسفل اسمك ومسماك الوظيفي
# فعّل هذا الخيار في ملف _config.yml عبر: languages.ar.header_intro: true

intro: >-
  محقق استشاري من شارع بيكر، متخصص في علم الاستنتاج، والكيمياء الجنائية، وحل القضايا التي استعصت على الشرطة الرسمية. تستعين به سكوتلاند يارد، وعملاء من القطاع الخاص، وأحياناً البيوت الملكية الأوروبية، كلما بلغت القنوات القانونية الاعتيادية حدودها.
