intro: >-
  قائد تقني استراتيجي وخبير معماري في الحلول السحابية بخبرة تتجاوز 12 عاماً في تصميم الأنظمة الموزعة عالية الإنتاجية، والبنى التحتية السحابية الحيوية، والمنصات الرقمية ثنائية اللغة. شغوف بالابتكار مفتوح المصدر والتميز الهندسي وتمكين الفرق التقنية متعددة التخصصات من إنجاز حلول برمجية مؤسسية واسعة النطاق.
