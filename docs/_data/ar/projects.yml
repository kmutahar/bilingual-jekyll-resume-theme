# المشاريع
# الملف: _data/ar/projects.yml
# المشاريع الهندسية المهنية والشخصية
#
# ملاحظات المخطط:
# - `project`: اسم المشروع.
# - `role`: دورك أو مسؤوليتك في المشروع.
# - `duration`: الفترة الزمنية المعروضة (تدعم &ndash;).
# - `url`: رابط اختياري للمشروع أو مستودع الشيفرة المصدرية.
# - `description`: نظرة عامة على التقنيات والمعمارية والأثر المتحقق.
# - `active`: اضبط على false لاستبعاد المشروع من السيرة الذاتية.

# مشروع مع رابط مباشر
- project: "أوبن ستريم: شبكة معالجة الأحداث فائقة الإنتاجية"
  active: true
  role: "المبتكر والمشرف الرئيسي"
  duration: "يناير 2023 &ndash; الحاضر"
  url: "https://github.com/example/openstream"
  description: >-
    شبكة موزعة مفتوحة المصدر لمعالجة الأحداث طُوّرت بلغة Go وتقنية eBPF لمعالجة التدفقات بدون نسخ وسيط. تُشغّل تحليلات فورية عبر أكثر من 10,000 عقدة بزمن استجابة يقاس بالميكروثانية.

# مشروع بدون رابط مباشر (مبادرة مؤسسية داخلية أو خاصة)
- project: "تحديث منصة السجلات المصرفية المركزية"
  active: true
  role: "استشاري أول للبنية التحتية"
  duration: "مارس 2021 &ndash; نوفمبر 2022"
  description: >-
    قيادة خطة ترحيل قواعد البيانات بدون أي انقطاع في الخدمة لبنك تجاري رائد، ونقل 85 مليون حساب من الأنظمة القديمة إلى CockroachDB السحابية مع سجلات تدقيق مشفرة.

