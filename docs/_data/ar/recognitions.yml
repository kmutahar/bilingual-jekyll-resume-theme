# الجوائز والتكريم
# الملف: _data/ar/recognitions.yml
# الجوائز والأوسمة والتكريمات المهنية
#
# ملاحظات المخطط:
# - `award`: مسمى الجائزة أو التكريم.
# - `organization`: المنظمة أو الهيئة أو المؤسسة المانحة.
# - `year`: سنة فردية (مثلاً "2023") أو سنوات مفصولة بفواصل للتكريمات المتكررة (مثلاً "2020، 2022").
# - `summary`: سياق سردي يوضح أهمية الجائزة والسبب وراء منحها.
# - `active`: اضبط على false لاستبعاد التكريم من السيرة الذاتية.

