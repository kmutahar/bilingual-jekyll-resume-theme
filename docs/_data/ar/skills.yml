# المهارات
# الملف: _data/ar/skills.yml
# المهارات والكفاءات المهنية
#
# ملاحظات المخطط:
# - `skill`: مجال المهارة أو عنوان الكفاءة التقنية.
# - `description`: وصف تفصيلي وسردي للخبرة التقنية والأدوات والممارسات.
# - `active`: اضبط على false لحجب المهارة من السيرة الذاتية.

- skill: "الكيمياء &amp; التحليل الجنائي"
  active: true
  description: >-
    خبير في الكيمياء التحليلية والعضوية المطبقة على التحقيق الجنائي، بما يشمل الكشف عن الدماء والسموم والآثار الدقيقة، والتحليل المقارن لرماد التبغ والحبر والورق.

- skill: "الملاحظة والاستنتاج &amp; الاستدلال"
  active: true
  description: >-
    علم الاستنتاج: الاستدلال العكسي من التفاصيل الصغيرة الملاحَظة، كالغبار والبقع والتصلبات وعادات اللباس، للوصول إلى التسلسل الدقيق للأحداث وشخصية من يخضع للفحص.

- skill: "التنكر وانتحال الشخصية &amp; أساليب العمل السري"
  active: true
  description: >-
    ماهر في التنكر الجسدي، واللهجات، وانتحال الهوية، يستخدمها في المراقبة والتسلل حيثما يُبطل الاستجواب المباشر غرض التحقيق.

- skill: "باريتسو والملاكمة &amp; مبارزة العصا المفردة"
  active: true
  description: >-
    متدرب على فن القتال الهجين الياباني الأوروبي (باريتسو)، والملاكمة كهاوٍ، ومبارزة العصا المفردة، يطبقها في المواجهات الجسدية والدفاع عن النفس أثناء سير القضايا.

- skill: "التحليل التشفيري &amp; حل الشيفرات"
  active: false
  description: >-
    حل شيفرات الاستبدال والتبديل والمراسلات المشفرة، يمارسها كتخصص جانبي لا كمجال ممارسة رئيسي.
