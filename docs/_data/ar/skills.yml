# المهارات
# الملف: _data/ar/skills.yml
# المهارات والكفاءات المهنية
#
# ملاحظات المخطط:
# - `skill`: مجال المهارة أو عنوان الكفاءة التقنية.
# - `description`: وصف تفصيلي وسردي للخبرة التقنية والأدوات والممارسات.
# - `active`: اضبط على false لحجب المهارة من السيرة الذاتية.

- skill: "البنية التحتية السحابية والمعمارية الموزعة"
  active: true
  description: >-
    خبرة متقدمة في تصميم البنى التحتية متعددة المناطق عالية التوافر والمرونة على منصات AWS وGoogle Cloud. إدارة متقدمة للحاويات بواسطة Kubernetes وTerraform وشبكات الخدمات (Istio) وبيئات البنية التحتية الثابتة.

- skill: "هندسة الأنظمة الخلفية عالية التزامن"
  active: true
  description: >-
    إتقان تقني عميق للغات Go وPython وRust. تخصص دقيق في المعالجة المتزامنة منخفضة الكمون، وبروتوكولات gRPC، وApache Kafka، وتجزئة قواعد البيانات، والتخزين المؤقت الموزع باستخدام Redis وMemcached.

- skill: "الاستراتيجية التقنية والإرشاد والقيادة المرنة"
  active: true
  description: >-
    سجل حافل في وضع المعايير الهندسية، وتحديد خارطة الطريق المعمارية لعدة سنوات، وإدارة مراجعات التصميم، وتوجيه كبار المهندسين للترقي إلى أدوار قيادية ومرجعية.

- skill: "إعادة هيكلة الأنظمة المركزية القديمة وترحيلها"
  active: false
  description: >-
    تفكيك الأنظمة المركزية القديمة إلى خدمات مصغرة موجهة بالمجال باستخدام نمط الشجرة الخانقة (Strangler Fig) وتزامن البيانات الموجه بالأحداث.
