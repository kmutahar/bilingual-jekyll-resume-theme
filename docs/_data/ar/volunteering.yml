# - تستخدم المناصب المستمرة تواريخ ISO (startdate: YYYY-MM-DD، و enddate: YYYY-MM-DD أو enddate: "حتى الآن").
# - تستخدم الفترات غير المتصلة مصفوفة durations مع كيانات HTML (مثل &ndash; و &amp;).
# - يظهر حقل `summary` عند تفعيل `enable_summary: true` في ملف `_config.yml`.
# - الخيار `active: false` يحفظ السجلات التاريخية دون عرضها في السيرة الذاتية.

