# الأعمال التطوعية
# الملف: _data/ar/volunteering.yml
# العمل التطوعي وخدمة المجتمع
#
# ملاحظات المخطط:
# - يتم تجميع الأعمال التطوعية حسب اسم المنظمة (company)؛ تظهر المناصب المتعددة لدى نفس الجهة معاً.
# - تستخدم المناصب المستمرة تواريخ ISO (startdate: YYYY-MM-DD، و enddate: YYYY-MM-DD أو enddate: "حتى الآن").
# - تستخدم الفترات غير المتصلة مصفوفة durations مع كيانات HTML (&ndash;، &amp;).
# - يظهر حقل `summary` عند تفعيل `enable_summary: true` في ملف `_config.yml`.
# - الخيار `active: false` يحفظ السجلات التاريخية دون عرضها في السيرة الذاتية.

# عمل مجاني مستمر في القضايا
- company: "الممارسة المجانية المستقلة"
  position: "محقق استشاري متطوع لعملاء ذوي إمكانات محدودة"
  startdate: 1881-01-01
  enddate: "حتى الآن"
  location: "لندن، إنجلترا"
  active: true
  notes: "لا تُقبل أي أتعاب حين يعجز العميل عن الدفع وتكون المسألة ذات أهمية"
  summary: >-
    يتولى القضايا دون مقابل كلما عجز العميل عن الدفع وكانت المسألة نفسها تحمل ملامح ذات أهمية علمية أو عامة، من المربيات إلى صغار التجار.

# تعليم مجتمعي في فترة التقاعد
