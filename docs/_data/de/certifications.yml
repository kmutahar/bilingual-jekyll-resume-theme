# Zertifizierungen
# File: _data/de/certifications.yml
# Berufliche Zertifizierungen und Lizenzen
#
# Schema-Hinweise:
# - `name`: Bezeichnung der Zertifizierung (unterstützt HTML-Entitäten wie &ndash;).
# - `issuing_organization`: Ausstellende Organisation.
# - `credential_id`: Optionale Zertifikats-ID.
# - `credential_url`: Optionale Verifizierungs-URL, die mit der Zertifikats-ID verknüpft ist.
# - `issue_date`: Erforderliches ISO-Datum (YYYY-MM-DD).
# - `expiration`: Optionales Ablaufdatum im ISO-Format (bei unbefristeten Zertifikaten leer lassen).
# - `courses`: Optionale verschachtelte Liste für interne Aufzeichnungen (wird nie im Lebenslauf angezeigt).
# - `active`: Auf false setzen, um den Eintrag im generierten Lebenslauf auszulassen.

