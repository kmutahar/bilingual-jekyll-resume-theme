intro: >-
  Beratender Detektiv der Baker Street, spezialisiert auf die Wissenschaft der Deduktion, forensische Chemie und die Lösung von Fällen, die sich für die offizielle Polizei als unlösbar erwiesen haben. Beauftragt von Scotland Yard, privaten Klienten und gelegentlich den Königshäusern Europas, wann immer die gewöhnlichen Mittel des Gesetzes an ihre Grenzen gestoßen sind.
