# Associations
# File: _data/en/associations.yml
# Professional memberships, working groups, and industry associations
#
# Schema notes:
# - `organization`: Name of the professional society or group.
# - `role`: Membership level or leadership position.
# - `year`: Time period (supports &ndash; for spans).
# - `url`: Optional official website URL (rendered as link and printed in print stylesheet).
# - `summary`: Optional description of contributions and governance.
# - `active`: Set to false to omit from generated resume.

# Association with a URL
- organization: "The Diogenes Club"
  active: true
  role: "Guest Member (through brother Mycroft Holmes)"
  year: "1888 &ndash; Present"
  url: "https://example.com/diogenes-club"
  summary: >-
    Occasional guest of the most unsociable club in London, where silence is enforced by rule and Mycroft Holmes maintains a permanent chair by the window.

# Association without a URL
- organization: "Chemical Society of London"
  active: true
  role: "Corresponding Member"
  year: "1878 &ndash; Present"
  summary: >-
    Corresponds occasionally on matters of analytical chemistry relevant to forensic detection, without regular attendance at proceedings.

# Inactive association demonstrating the active flag
- organization: "University Amateur Boxing Society"
  active: false
  role: "General Member"
  year: "1873 &ndash; 1876"
  summary: >-
    Early university membership, maintained for sparring practice rather than professional development.
