# Certifications
# File: _data/en/certifications.yml
# Professional certifications and licenses
#
# Schema notes:
# - `name`: Certification title (supports HTML entities like &ndash;).
# - `issuing_organization`: Organization granting the credential.
# - `credential_id`: Optional certificate identifier.
# - `credential_url`: Optional verification URL linking the credential ID.
# - `issue_date`: Required ISO date (YYYY-MM-DD).
# - `expiration`: Optional expiration ISO date (leave blank for non-expiring credentials).
# - `courses`: Optional nested list for internal record-keeping (never rendered on the resume).
# - `active`: Set to false to omit from generated resume.

# Credential with verification ID, URL, and expiration date
- name: "AWS Certified Solutions Architect &ndash; Professional"
  active: true
  issuing_organization: "Amazon Web Services"
  credential_id: "AWS-PSA-7829104"
  credential_url: "https://aws.amazon.com/verification"
  issue_date: 2023-04-15
  expiration: 2026-04-15

# Credential with ID, URL, expiration, and nested courses for personal record-keeping
- name: "Certified Kubernetes Administrator (CKA)"
  active: true
  issuing_organization: "Cloud Native Computing Foundation (CNCF)"
  credential_id: "CKA-2409852"
  credential_url: "https://www.cncf.io/certification/cka/"
  issue_date: 2022-11-20
  expiration: 2025-11-20
  courses: # Optional: INTERNAL USE ONLY - not displayed on resume
    - name: "Kubernetes Deep Dive & Production Operations"
      active: false
      issuing_organization: "The Linux Foundation"
      credential_id: "LF-K8S-019"
      credential_url: "https://training.linuxfoundation.org"
      issue_date: 2022-10-05

