# Courses
# File: _data/en/courses.yml
# Training courses, workshops, and executive education programs
#
# Schema notes:
# - `name`: Course title (supports HTML entities).
# - `issuing_organization`: Platform or institution delivering the course.
# - `credential_id`: Optional completion credential or certificate identifier.
# - `credential_url`: Optional verification link.
# - `startdate`: Required start date (YYYY-MM-DD).
# - `enddate`: Optional completion date (YYYY-MM-DD).
# - `summary`: Detailed curriculum narrative (displayed when `enable_summary: true`).
# - `active`: Set to false to omit from resume.

# Course with dates, credential ID, verification URL, and summary
- name: "Baritsu &amp; Singlestick Combat Techniques"
  active: true
  issuing_organization: "Bartitsu Club, London"
  credential_id: "BARTITSU-LDN-1897"
  credential_url: "https://example.com/bartitsu-club/verify/1897"
  startdate: 1897-01-10
  enddate: 1897-06-30
  notes: "Foundation for close-quarters self-defense used in the field"
  summary: >-
    Instruction in the Japanese-European hybrid martial art combining jujitsu holds, boxing, and singlestick fencing, later applied during the confrontation at the Reichenbach Falls.

# Course with dates and summary, no credential
- name: "Cryptography &amp; Cipher Solving"
