  location: "Stanford, CA"
  active: true
  awards:
    - award: "Graduate Fellowship in Systems Architecture"
    - award: "Outstanding Graduate Research Paper Award (2019)"
  summary: >-
    Specialized in Distributed Systems and Cloud Infrastructure. Thesis: "Low-Latency Consensus Protocols for Heterogeneous Edge-Cloud Clusters."

