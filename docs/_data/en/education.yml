# Education
# File: _data/en/education.yml
# Academic degrees and educational background
#
# Schema notes:
# - `uni`: Institution or university name.
# - `degree`: Degree title and specialization.
# - `year`: Display time period (using &ndash; for date spans).
# - `location`: Location of the institution.
# - `awards`: Optional list of honors/fellowships.
# - `award`: Optional single award string (can be used alongside or instead of awards list).
# - `summary`: Narrative paragraph detailing coursework, thesis, or academic honors.
# - `active`: Set to false to preserve records without displaying them.

# University period (the canon leaves the institution unnamed)
- degree: "Undergraduate Studies in Chemistry and the Natural Sciences"
  uni: "University (institution undocumented in the surviving record)"
  year: "1872 &ndash; 1876"
  location: "England"
  active: true
  summary: >-
    Concentrated on organic chemistry, anatomy, and the sensational literature of crime, to the general neglect of the standard curriculum. Spent two years in rooms before removing to London to begin independent practice.

# Private laboratory study at Bart's, where the Watson partnership began
- degree: "Private Study in Analytical and Forensic Chemistry"
  uni: "St. Bartholomew's Hospital Laboratories"
  year: "1877 &ndash; 1881"
  location: "London, England"
  active: true
  award: "Devised a reagent for the detection of haemoglobin stains, precipitable by nothing else"
  summary: >-
    Independent laboratory research into blood detection, poisons, and the chemical analysis of trace evidence, conducted alongside occasional casework. It was in these laboratories that the partnership with Dr. John H. Watson began.

