# Experience
# File: _data/en/experience.yml
# Professional work experience and employment history
#
# Schema notes:
# - Roles are grouped by `company` name; multiple positions at the same employer appear together.
# - Roles within the same company are sorted by `startdate` (most recent first).
# - Continuous roles use ISO dates (`startdate: YYYY-MM-DD`, `enddate: YYYY-MM-DD` or `enddate: Present`).
# - Non-continuous roles use the `durations` array with HTML entities (`&ndash;`, `&amp;`).
# - `active: false` preserves historical or drafting entries without rendering them.

