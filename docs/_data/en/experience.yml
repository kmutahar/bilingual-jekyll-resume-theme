# Experience
# File: _data/en/experience.yml
# Professional work experience and employment history
#
# Schema notes:
# - Roles are grouped by `company` name; multiple positions at the same employer appear together.
# - Roles within the same company are sorted by `startdate` (most recent first).
# - Continuous roles use ISO dates (`startdate: YYYY-MM-DD`, `enddate: YYYY-MM-DD` or `enddate: Present`).
# - Non-continuous roles use the `durations` array with HTML entities (`&ndash;`, `&amp;`).
# - `active: false` preserves historical or drafting entries without rendering them.

# Independent practice (current)
- company: "221B Baker Street, Independent Practice"
  position: "Consulting Detective"
  startdate: 1881-01-01
  enddate: Present
  location: "London, England"
  active: true
  notes: "The only consulting detective in practice"
  summary: >-
    Originated the profession of consulting detective. Investigate cases referred by private clients, official police forces, and foreign governments, applying methodical observation and deductive reasoning where conventional investigation has failed.

