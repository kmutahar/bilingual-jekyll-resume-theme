# Projects
# File: _data/en/projects.yml
# Personal and professional engineering projects
#
# Schema notes:
# - `project`: Name of the project.
# - `role`: Your title or responsibility on the project.
# - `duration`: Display time period (supports &ndash;).
# - `url`: Optional live destination or source repository URL.
# - `description`: Narrative overview of technologies, architecture, and impact.
# - `active`: Set to false to omit from generated resume.

# Signature forensic monograph
- project: "Upon the Distinction Between the Ashes of the Various Tobaccos"
  active: true
  role: "Author"
  duration: "1887"
  url: "https://example.com/monographs/tobacco-ashes"
  description: >-
    A monograph enumerating one hundred and forty forms of pipe, cigar, and cigarette tobacco ash, illustrated with plates, for the forensic distinction of tobacco residue found at a scene.

# Retirement-era apiary handbook
- project: "Practical Handbook of Bee Culture, With Some Observations Upon the Segregation of the Queen"
  active: true
  role: "Author"
  duration: "1903 &ndash; Present"
  description: >-
    A handbook of apiary management written during retirement on the South Downs, combining close observation of hive behaviour with the same methodical rigour applied to earlier casework.

# Study on footprint evidence
- project: "Monograph Upon the Tracing of Footsteps, With Remarks on Plaster of Paris as a Preserver of Impressions"
  active: true
  role: "Author"
  duration: "1889"
  description: >-
    A technical study on the preservation and comparative analysis of footprint impressions using plaster casts, developed to standardise evidence gathering at outdoor scenes.

