# Recognitions
# File: _data/en/recognitions.yml
# Honors, awards, and professional recognitions
#
# Schema notes:
# - `award`: Title or name of the recognition.
# - `organization`: Conferring body, enterprise, or institution.
# - `year`: Single year (e.g., "2023") or comma-separated years for repeated honors (e.g., "2020, 2022").
# - `summary`: Narrative context and significance of the honor.
# - `active`: Set to false to omit from generated resume.

# Award with single year
- award: "Cloud Innovator of the Year"
  active: true
  organization: "Global Enterprise Cloud Summit"
  year: "2023"
  summary: >-
    Awarded in recognition of pioneering zero-trust cloud orchestration architecture that reduced cross-region data transfer latency by 45% across global banking clients.

# Award with multiple years
- award: "Distinguished Engineering Excellence Award"
  active: true
  organization: "Apex Cloud Systems"
  year: "2020, 2022"
  summary: >-
    Conferred twice for outstanding technological leadership and architecting core fault-tolerant infrastructure during peak multi-petabyte processing events.

# Inactive recognition record demonstrating the active flag
- award: "Outstanding Graduate Student Award"
  active: false
  organization: "Stanford University School of Engineering"
  year: "2019"
  summary: >-
    Recognized for academic excellence and contributions to distributed computing research.
