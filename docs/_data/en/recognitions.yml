# Recognitions
# File: _data/en/recognitions.yml
# Honors, awards, and professional recognitions
#
# Schema notes:
# - `award`: Title or name of the recognition.
# - `organization`: Conferring body, enterprise, or institution.
# - `year`: Single year (e.g., "2023") or comma-separated years for repeated honors (e.g., "2020, 2022").
# - `summary`: Narrative context and significance of the honor.
# - `active`: Set to false to omit from generated resume.

# Service to a foreign government
- award: "Recognition for Services to the French Republic"
  active: true
  organization: "French Republic"
  year: "1890"
  summary: >-
    Acknowledged for a delicate matter of state resolved on behalf of the French government, the details of which remain undisclosed at the request of the parties concerned.

# Personal gift from the Crown
- award: "Emerald Tie-Pin, Personal Gift"
  active: true
  organization: "Her Majesty the Queen"
  year: "1895"
  summary: >-
    Presented in personal recognition of a service of considerable delicacy and importance, the nature of which is not a matter for publication.

# Repeated honor across years
- award: "Snuff-Box Set with an Amethyst"
  active: true
  organization: "Foreign Royal Households"
  year: "1888, 1892"
  summary: >-
    Received on two occasions from grateful foreign clients following the confidential resolution of matters affecting their households.

# Declined honor, inactive by choice
- award: "Offer of Knighthood (Declined)"
  active: false
  organization: "British Crown"
  year: "1902"
  summary: >-
    An honour offered but respectfully declined, preferring the freedom of independent practice to formal public distinction.
