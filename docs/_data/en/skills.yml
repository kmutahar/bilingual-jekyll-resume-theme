# Professional skills and competencies
#
# Schema notes:
# - `skill`: Skill domain, competence area, or title.
# - `description`: Detailed narrative description of technical expertise, tools, and practices.
# - `active`: Set to false to omit from generated resume.

- skill: "Chemistry &amp; Forensic Analysis"
  active: true
  description: >-
    Expert in analytical and organic chemistry as applied to criminal investigation, including blood, poison, and trace-residue detection, and the comparative analysis of tobacco ash, ink, and paper.

- skill: "Observation, Deduction &amp; Inference"
  active: true
  description: >-
    The science of deduction: reasoning backward from observed trifles, dust, stains, calluses, and habits of dress, to the exact chain of events and character of the person under examination.

- skill: "Disguise, Impersonation &amp; Undercover Method"
  active: true
  description: >-
    Skilled in physical disguise, dialect, and assumed identity, employed for surveillance and infiltration where direct inquiry would defeat the purpose of an investigation.

- skill: "Baritsu, Boxing &amp; Singlestick"
  active: true
  description: >-
    Trained in the Japanese-European hybrid combat art of baritsu, amateur boxing, and singlestick fencing, applied to physical confrontation and self-defense in the course of casework.

- skill: "Cryptanalysis &amp; Cipher Solving"
  active: false
  description: >-
    Solving of substitution and transposition ciphers and coded correspondence, retained as a specialised sideline rather than a primary practice area.
