# Volunteering
# File: _data/en/volunteering.yml
# Volunteer work and community service
#
# Schema notes:
# - Grouped by `company` name; multiple positions at the same organization appear together.
# - Continuous positions use ISO dates (`startdate: YYYY-MM-DD`, `enddate: YYYY-MM-DD` or `enddate: Present`).
# - Non-continuous positions use the `durations` array with HTML entities (`&ndash;`, `&amp;`).
# - `summary` is displayed when `enable_summary: true` is configured in `_config.yml`.
# - `active: false` preserves entries without rendering them.

