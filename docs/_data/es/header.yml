intro: >-
  Detective asesor de Baker Street, especializado en la ciencia de la deducción, la química forense y la resolución de casos que han resultado insolubles para la policía oficial. Contratado por Scotland Yard, clientes particulares y, en ocasiones, las casas reales de Europa, siempre que los cauces habituales de la ley hayan llegado a su límite.
