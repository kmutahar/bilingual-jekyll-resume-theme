# رکنیتیں
# فائل: _data/ur/associations.yml
# پیشہ ورانہ رکنیتیں، ورکنگ گروپس، اور صنعتی انجمنیں
#
# اسکیمہ نوٹس:
# - `organization`: پیشہ ورانہ سوسائٹی یا گروپ کا نام۔
# - `role`: رکنیت کی سطح یا قائدانہ عہدہ۔
# - `year`: دورانیہ (وقفوں کے لیے &ndash; کی حمایت کرتا ہے)۔
# - `url`: اختیاری سرکاری ویب سائٹ (بطور لنک اور پرنٹ اسٹائل شیٹ میں دکھائی جاتی ہے)۔
# - `summary`: تعاون اور نظم و نسق کی اختیاری تفصیل۔
# - `active`: تیار کردہ سی وی سے خارج کرنے کے لیے false کریں۔

# یو آر ایل کے ساتھ رکنیت
- organization: "ڈایوجینیز کلب"
  active: true
  role: "مہمان رکن (بھائی مائیکروفٹ ہومز کے توسط سے)"
  year: "1888 &ndash; تاحال"
  url: "https://example.com/diogenes-club"
  summary: >-
    لندن کے سب سے کم میل جول رکھنے والے کلب کا کبھی کبھار مہمان، جہاں خاموشی قاعدے کے تحت لازم ہے اور مائیکروفٹ ہومز کھڑکی کے پاس ایک مستقل کرسی رکھتے ہیں۔

# یو آر ایل کے بغیر رکنیت
- organization: "کیمیکل سوسائٹی آف لندن"
  active: true
  role: "مکاتباتی رکن"
  year: "1878 &ndash; تاحال"
  summary: >-
    فرانزک شناخت سے متعلق تجزیاتی کیمیا کے معاملات پر کبھی کبھار مکاتبت کرتے ہیں، بغیر کارروائیوں میں باقاعدہ شرکت کے۔

