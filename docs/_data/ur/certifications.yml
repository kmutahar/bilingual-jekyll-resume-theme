# سرٹیفیکیشنز
# فائل: _data/ur/certifications.yml
# پیشہ ورانہ سرٹیفیکیشنز اور لائسنس
#
# اسکیمہ نوٹس:
# - `name`: سرٹیفیکیشن کا عنوان (HTML اینٹیٹیز جیسے &ndash; کی حمایت کرتا ہے)۔
# - `issuing_organization`: سند جاری کرنے والا ادارہ۔
# - `credential_id`: اختیاری سرٹیفکیٹ شناختی نمبر۔
# - `credential_url`: سند کی توثیق کے لیے اختیاری یو آر ایل۔
# - `issue_date`: لازمی ISO تاریخ (YYYY-MM-DD)۔
# - `expiration`: اختیاری معیاد ختم ہونے کی ISO تاریخ (غیر معینہ المدت سندوں کے لیے خالی چھوڑیں)۔
# - `courses`: داخلی ریکارڈ کے لیے اختیاری نیسٹڈ فہرست (سی وی پر کبھی ظاہر نہیں ہوتی)۔
# - `active`: تیار کردہ سی وی سے خارج کرنے کے لیے false کریں۔

