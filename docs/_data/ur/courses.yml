# کورسز
# فائل: _data/ur/courses.yml
# تربیتی کورسز، ورکشاپس، اور ایگزیکٹو تعلیمی پروگرام
#
# اسکیمہ نوٹس:
# - `name`: کورس کا عنوان (HTML اینٹیٹیز کی حمایت کرتا ہے)۔
# - `issuing_organization`: کورس فراہم کرنے والا پلیٹ فارم یا ادارہ۔
# - `credential_id`: اختیاری تکمیلی سند یا سرٹیفکیٹ شناختی نمبر۔
# - `credential_url`: اختیاری توثیقی لنک۔
# - `startdate`: لازمی آغاز کی تاریخ (YYYY-MM-DD)۔
# - `enddate`: اختیاری تکمیل کی تاریخ (YYYY-MM-DD)۔
# - `summary`: تفصیلی نصابی بیان (جب `enable_summary: true` ہو تو ظاہر ہوتا ہے)۔
# - `active`: سی وی سے خارج کرنے کے لیے false کریں۔

# تاریخوں، سند کے شناختی نمبر، توثیقی یو آر ایل، اور خلاصے کے ساتھ کورس
- name: "باریتسو &amp; سنگل اسٹک لڑائی کی تکنیکیں"
  active: true
  issuing_organization: "بارٹسو کلب، لندن"
  credential_id: "BARTITSU-LDN-1897"
  credential_url: "https://example.com/bartitsu-club/verify/1897"
  startdate: 1897-01-10
  enddate: 1897-06-30
  notes: "میدان میں استعمال ہونے والے قریبی مقابلے کے خود دفاع کی بنیاد"
  summary: >-
    جاپانی-یورپی مخلوط رزمی فن کی تربیت جو جوجٹسو کی گرفتوں، مکے بازی، اور سنگل اسٹک تلوار بازی کو یکجا کرتی ہے، جو بعد میں رائیخن باخ آبشار کے مقابلے میں بروئے کار لائی گئی۔

# تاریخوں اور خلاصے کے ساتھ کورس، بغیر سند کے
- name: "خفیہ نویسی &amp; رمز کشائی"
  active: true
  issuing_organization: "نجی مطالعہ"
  startdate: 1893-01-01
  enddate: 1893-12-01
  notes: "خفیہ تحریروں پر ایک مقالہ تیار کرنے کے لیے شروع کیا گیا"
  summary: >-
    تبادلی اور تقلیبی رموز کا منظم مطالعہ، جو بعد میں ڈانسنگ مین رمز اور خفیہ خط و کتابت پر مشتمل دیگر مقدمات کے حل میں بروئے کار لایا گیا۔

# active فلیگ کو ظاہر کرنے والا غیر فعال کورس
- name: "وائلن بجانے کی تکنیک، اعلیٰ مطالعہ"
  active: false
  issuing_organization: "نجی تربیت"
  credential_id: "VIOLIN-PRIV-1870"
  startdate: 1870-01-01
  enddate: 1871-12-01
  notes: "ابتدائی ذاتی مطالعہ، پیشہ ورانہ لحاظ سے غیر متعلقہ"
  summary: >-
    وائلن کی اعلیٰ تربیت جو پیشہ ورانہ ترقی کی بجائے ذاتی دلچسپی کے طور پر حاصل کی گئی۔
