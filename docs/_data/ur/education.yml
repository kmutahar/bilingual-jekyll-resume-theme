# تعلیم
# فائل: _data/ur/education.yml
# تعلیمی ڈگریاں اور تعلیمی پس منظر
#
# اسکیمہ نوٹس:
# - `uni`: ادارے یا یونیورسٹی کا نام۔
# - `degree`: ڈگری کا عنوان اور تخصص۔
# - `year`: دورانیہ دکھانے کے لیے (تاریخ کے وقفے کے لیے &ndash; استعمال کریں)۔
# - `location`: ادارے کا مقام۔
# - `awards`: اختیاری اعزازات/فیلوشپس کی فہرست۔
# - `award`: اختیاری واحد اعزاز کی سطر (فہرست کے ساتھ یا اس کی بجائے استعمال ہو سکتی ہے)۔
# - `summary`: نصاب، مقالے، یا تعلیمی اعزازات کی تفصیل۔
# - `active`: ریکارڈ کو محفوظ رکھنے مگر ظاہر نہ کرنے کے لیے false کریں۔

# یونیورسٹی کا دور (روایتی داستانوں میں ادارے کا نام درج نہیں)
- degree: "کیمیا اور علومِ طبیعی میں انڈرگریجویٹ تعلیم"
  uni: "یونیورسٹی (ادارے کا نام محفوظ شدہ ریکارڈ میں غیر مذکور ہے)"
  year: "1872 &ndash; 1876"
  location: "انگلستان"
  active: true
  summary: >-
    نامیاتی کیمیا، تشریح الاعضاء، اور جرائم سے متعلق ہیجان انگیز ادب پر توجہ مرکوز رکھی، جبکہ معیاری نصاب کو عمومی طور پر نظرانداز کیا۔ کمرہ گاہ میں دو سال گزارے، پھر آزادانہ پریکٹس شروع کرنے کے لیے لندن منتقل ہو گئے۔

# سینٹ بارٹس میں نجی تجربہ گاہی مطالعہ، جہاں واٹسن کے ساتھ شراکت کا آغاز ہوا
- degree: "تجزیاتی اور فرانزک کیمیا میں نجی مطالعہ"
  uni: "سینٹ بارتھولومیو ہسپتال کی تجربہ گاہیں"
  year: "1877 &ndash; 1881"
  location: "لندن، انگلستان"
  active: true
  award: "ہیموگلوبن کے دھبوں کی نشاندہی کے لیے ایک ایسا ری ایجنٹ تیار کیا جو کسی اور طریقے سے قابلِ ترسیب نہیں تھا"
  summary: >-
    خون کی نشاندہی، زہروں، اور ثبوت کے باریک نشانات کے کیمیائی تجزیے پر آزادانہ تجربہ گاہی تحقیق، جو کبھی کبھار مقدماتی کام کے ساتھ ساتھ کی گئی۔ انہی تجربہ گاہوں میں ڈاکٹر جان ایچ۔ واٹسن کے ساتھ شراکت کا آغاز ہوا۔

