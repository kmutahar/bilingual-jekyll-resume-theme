    قتل، بلیک میلنگ، اور مملکتی سلامتی کے معاملات سمیت ایسے مقدمات پر مشورہ دیتا ہے جو سرکاری فورس کی معمول کی صلاحیت سے باہر ہوں۔ متعدد ایسے مقدمات کے حل کا سہرا نجی طور پر اس کے سر ہے جو سرکاری طور پر حل شدہ درج کیے گئے۔

