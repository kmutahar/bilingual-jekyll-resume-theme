# تجربہ
# فائل: _data/ur/experience.yml
# پیشہ ورانہ کام کا تجربہ اور ملازمت کی تاریخ
#
# اسکیمہ نوٹس:
# - عہدوں کو `company` کے نام کے تحت گروپ کیا گیا ہے؛ ایک ہی آجر کے متعدد عہدے ایک ساتھ ظاہر ہوتے ہیں۔
# - ایک ہی کمپنی میں عہدے `startdate` کے لحاظ سے ترتیب دیے گئے ہیں (تازہ ترین سب سے پہلے)۔
# - مسلسل عہدوں میں ISO تاریخیں استعمال ہوتی ہیں (`startdate: YYYY-MM-DD`, `enddate: YYYY-MM-DD` یا `enddate: "تاحال"`)۔
# - غیر مسلسل عہدوں میں HTML اینٹیٹیز (`&ndash;`, `&amp;`) کے ساتھ `durations` صف استعمال ہوتی ہے۔
# - `active: false` ریکارڈ کو محفوظ رکھتا ہے مگر ظاہر نہیں کرتا۔

# آزادانہ پریکٹس (حالیہ)
- company: "221B بیکر اسٹریٹ، نجی پریکٹس"
  position: "مشاورتی سراغ رساں"
  startdate: 1881-01-01
  enddate: "تاحال"
  location: "لندن، انگلستان"
  active: true
  notes: "پریکٹس میں واحد مشاورتی سراغ رساں"
  summary: >-
    مشاورتی سراغ رسانی کے پیشے کی داغ بیل ڈالی۔ نجی موکلین، سرکاری پولیس فورسز، اور غیر ملکی حکومتوں کی جانب سے بھیجے گئے مقدمات کی چھان بین، جہاں روایتی تفتیش ناکام ہو چکی ہو، منظم مشاہدے اور استخراجی استدلال کے ذریعے کی جاتی ہے۔

