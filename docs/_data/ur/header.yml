intro: >-
  بیکر اسٹریٹ کا مشاورتی سراغ رساں، جو علمِ استخراج، فرانزک کیمیا، اور اُن مقدمات کے حل میں مہارت رکھتا ہے جو سرکاری پولیس کے لیے ناقابلِ حل ثابت ہوئے۔ اسکاٹ لینڈ یارڈ، نجی موکلین، اور بسا اوقات یورپ کے شاہی خاندانوں کی جانب سے خدمات حاصل کی جاتی ہیں، جب قانون کے معمول کے ذرائع اپنی انتہا کو پہنچ جائیں۔
