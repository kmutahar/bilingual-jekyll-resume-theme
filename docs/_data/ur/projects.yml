# منصوبے
# فائل: _data/ur/projects.yml
# ذاتی اور پیشہ ورانہ انجینئرنگ منصوبے
#
# اسکیمہ نوٹس:
# - `project`: منصوبے کا نام۔
# - `role`: منصوبے میں آپ کا عہدہ یا ذمہ داری۔
# - `duration`: دورانیہ دکھانے کے لیے (&ndash; کی حمایت کرتا ہے)۔
# - `url`: اختیاری لائیو ڈیسٹینیشن یا سورس ریپازٹری یو آر ایل۔
# - `description`: ٹیکنالوجیز، فن تعمیر، اور اثرات کا تفصیلی جائزہ۔
# - `active`: تیار کردہ سی وی سے خارج کرنے کے لیے false کریں۔

# نمایاں فرانزک مقالہ
- project: "مختلف اقسام کے تمباکو کی راکھ کے مابین امتیاز پر"
  active: true
  role: "مصنف"
  duration: "1887"
  url: "https://example.com/monographs/tobacco-ashes"
  description: >-
    ایک مقالہ جو پائپ، سگار، اور سگریٹ کے تمباکو کی راکھ کی ایک سو چالیس اقسام کو تصاویر کے ساتھ درج کرتا ہے، تاکہ کسی مقام پر پائے جانے والے تمباکو کے آثار کی فرانزک شناخت ممکن ہو۔

# ریٹائرمنٹ کے دور کی شہد کی مکھیوں سے متعلق کتابچہ
- project: "شہد کی مکھیوں کی پرورش کا عملی کتابچہ، ملکہ مکھی کی علیحدگی سے متعلق چند مشاہدات کے ساتھ"
  active: true
  role: "مصنف"
  duration: "1903 &ndash; تاحال"
  description: >-
    ساؤتھ ڈاؤنز میں ریٹائرمنٹ کے دوران لکھا گیا شہد کی مکھیوں کے انتظام کا ایک کتابچہ، جو چھتے کے رویے کے قریبی مشاہدے کو اسی طریقہ کار کی سختی کے ساتھ یکجا کرتا ہے جو پہلے کے مقدماتی کام میں بروئے کار لائی گئی تھی۔

# خفیہ تحریروں پر مطالعہ
- project: "قدموں کے نشانات کی چھان بین پر مقالہ، بمعہ پلاسٹر آف پیرس کے بطور نشانات محفوظ کرنے کے ذریعے کے تبصرے"
  active: true
  role: "مصنف"
  duration: "1889"
  description: >-
    پلاسٹر کاسٹ کے ذریعے قدموں کے نشانات کو محفوظ کرنے اور ان کے تقابلی تجزیے پر ایک تکنیکی مطالعہ، جو کھلے مقامات پر ثبوت جمع کرنے کو معیاری بنانے کے لیے تیار کیا گیا۔

# active فلیگ کو ظاہر کرنے والا غیر فعال منصوبہ
