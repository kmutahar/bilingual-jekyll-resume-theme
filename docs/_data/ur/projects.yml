  active: false
  role: "مصنف"
  duration: "1883"
  description: >-
    مختلف پیشوں میں ہاتھ کے چھالوں اور بگاڑ کا موازنہ کرنے والا ایک ابتدائی، غیر مطبوعہ مطالعہ، جسے بعد میں زیادہ جامع مطبوعہ مقالوں نے متروک کر دیا۔
