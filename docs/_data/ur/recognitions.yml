  summary: >-
    اپنے خاندانوں سے متعلق معاملات کے خفیہ حل کے بعد شکر گزار غیر ملکی موکلین کی جانب سے دو مواقع پر موصول ہوا۔

# رد کیا گیا اعزاز، ذاتی انتخاب سے غیر فعال
- award: "نائٹ ہڈ کی پیشکش (مسترد شدہ)"
  active: false
  organization: "برطانوی تاج"
  year: "1902"
  summary: >-
    ایک ایسا اعزاز جو پیش کیا گیا مگر باادب طریقے سے مسترد کر دیا گیا، رسمی عوامی امتیاز کی بجائے آزادانہ پریکٹس کی آزادی کو ترجیح دیتے ہوئے۔
