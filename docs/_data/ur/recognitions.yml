# اعزازات
# فائل: _data/ur/recognitions.yml
# اعزازات، انعامات، اور پیشہ ورانہ پذیرائی
#
# اسکیمہ نوٹس:
# - `award`: اعزاز کا عنوان یا نام۔
# - `organization`: عطا کرنے والا ادارہ، کاروبار، یا تنظیم۔
# - `year`: واحد سال (مثلاً "2023") یا بار بار ملنے والے اعزازات کے لیے کوما سے جدا سال (مثلاً "2020, 2022")۔
# - `summary`: اعزاز کا پس منظر اور اہمیت۔
# - `active`: تیار کردہ سی وی سے خارج کرنے کے لیے false کریں۔

# ایک غیر ملکی حکومت کی خدمت
- award: "جمہوریہ فرانس کے لیے خدمات پر اعزاز"
  active: true
  organization: "جمہوریہ فرانس"
  year: "1890"
  summary: >-
    فرانسیسی حکومت کی جانب سے ایک نازک مملکتی معاملے کے حل پر پذیرائی حاصل ہوئی، جس کی تفصیلات متعلقہ فریقین کی درخواست پر ظاہر نہیں کی گئیں۔

# تاج کی جانب سے ذاتی تحفہ
- award: "زمرد جڑا ٹائی پن، ذاتی تحفہ"
  active: true
  organization: "ملکہ برطانیہ"
  year: "1895"
  summary: >-
    ایک نہایت نازک اور اہم خدمت کی ذاتی پذیرائی میں پیش کیا گیا، جس کی نوعیت اشاعت کے قابل نہیں۔

# متعدد سالوں میں بار بار ملنے والا اعزاز
- award: "امیتھسٹ جڑا نسوار دان سیٹ"
  active: true
