# مہارتیں
# فائل: _data/ur/skills.yml
# پیشہ ورانہ مہارتیں اور صلاحیتیں
#
# اسکیمہ نوٹس:
# - `skill`: مہارت کا شعبہ، اہلیت کا میدان، یا عنوان۔
# - `description`: تکنیکی مہارت، آلات، اور طریقہ کار کی تفصیلی وضاحت۔
# - `active`: تیار کردہ سی وی سے خارج کرنے کے لیے false کریں۔

- skill: "کیمیا &amp; فرانزک تجزیہ"
  active: true
  description: >-
    فوجداری تفتیش پر لاگو تجزیاتی اور نامیاتی کیمیا میں ماہر، بشمول خون، زہر، اور باریک آثار کی شناخت، اور تمباکو کی راکھ، سیاہی، اور کاغذ کا تقابلی تجزیہ۔

- skill: "مشاہدہ، استخراج &amp; استدلال"
  active: true
  description: >-
    استخراج کی سائنس: مشاہدہ کیے گئے معمولی نشانات، گرد، دھبوں، چھالوں، اور لباس کی عادات سے پیچھے کی طرف استدلال کرتے ہوئے واقعات کے عین سلسلے اور زیرِ جانچ شخص کے کردار تک پہنچنا۔

- skill: "بھیس بدلنا، نقالی &amp; خفیہ کارروائی کا طریقہ"
  active: true
  description: >-
    جسمانی بھیس، لہجے، اور مفروضہ شناخت میں ماہر، جو نگرانی اور دراندازی کے لیے استعمال ہوتا ہے، جہاں براہِ راست پوچھ گچھ تفتیش کا مقصد فوت کر دے۔

- skill: "باریتسو، مکے بازی &amp; سنگل اسٹک"
  active: true
  description: >-
    جاپانی-یورپی مخلوط رزمی فن باریتسو، شوقیہ مکے بازی، اور سنگل اسٹک تلوار بازی میں تربیت یافتہ، جو مقدماتی کام کے دوران جسمانی مقابلے اور خود دفاع میں بروئے کار لائی جاتی ہے۔

- skill: "علمِ رمزکشائی &amp; رموز کا حل"
  active: false
  description: >-
    تبادلی اور تقلیبی رموز اور خفیہ خط و کتابت کا حل، جسے بنیادی پریکٹس کے میدان کی بجائے ایک مخصوص ضمنی شعبے کے طور پر برقرار رکھا گیا ہے۔
