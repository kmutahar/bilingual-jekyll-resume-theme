# رضاکارانہ خدمات
# فائل: _data/ur/volunteering.yml
# رضاکارانہ کام اور خدمتِ خلق
#
# اسکیمہ نوٹس:
# - `company` کے نام کے تحت گروپ کیا گیا؛ ایک ہی ادارے کے متعدد عہدے ایک ساتھ ظاہر ہوتے ہیں۔
# - مسلسل عہدوں میں ISO تاریخیں استعمال ہوتی ہیں (`startdate: YYYY-MM-DD`, `enddate: YYYY-MM-DD` یا `enddate: "تاحال"`)۔
# - غیر مسلسل عہدوں میں HTML اینٹیٹیز (`&ndash;`, `&amp;`) کے ساتھ `durations` صف استعمال ہوتی ہے۔
# - `summary` اس وقت ظاہر ہوتا ہے جب `_config.yml` میں `enable_summary: true` مقرر ہو۔
# - `active: false` اندراجات کو محفوظ رکھتا ہے مگر ظاہر نہیں کرتا۔

# جاری رفاہی (pro bono) مقدماتی کام
- company: "آزادانہ رفاہی پریکٹس"
  position: "محدود وسائل کے حامل موکلین کے لیے بلا معاوضہ مشاورتی سراغ رساں"
  startdate: 1881-01-01
  enddate: "تاحال"
  location: "لندن، انگلستان"
  active: true
  notes: "جہاں موکل ادائیگی کی سکت نہ رکھتا ہو اور مسئلہ دلچسپ ہو، وہاں کوئی معاوضہ وصول نہیں کیا جاتا"
  summary: >-
    جب بھی موکل ادائیگی کے قابل نہ ہو اور مسئلہ خود سائنسی یا عوامی دلچسپی کے پہلو رکھتا ہو، بغیر معاوضے کے مقدمات قبول کیے جاتے ہیں، خواہ وہ گورنس ہو یا چھوٹا تاجر۔

# ریٹائرمنٹ کے دور کی کمیونٹی تعلیم
- company: "سسیکس ڈاؤنز شہد کی مکھیاں پالنے والوں کا حلقہ"
  position: "شہد کی مکھیوں کے چھتے کے انتظام پر رہنما &amp; مدرس"
  durations:
    - duration: "بہار 1904"
    - duration: "&amp; خزاں 1905"
  location: "سسیکس، انگلستان"
  active: true
  notes: "مقامی کسانوں کی انجمن، ریٹائرمنٹ کے دوران"
  summary: >-
    مقامی چھوٹے کاشتکاروں کو چھتے کے انتظام اور ملکہ مکھی کی علیحدگی کی تکنیکوں پر مشورہ دیا، جو نجی تحقیق پر مبنی تھا اور بعد میں شہد کی مکھیوں کی پرورش پر ایک کتابچے کی صورت میں شائع ہوا۔

# active فلیگ کو ظاہر کرنے والا غیر فعال رضاکارانہ ریکارڈ
- company: "وائٹ چیپل ڈسٹرکٹ ریلیف کمیٹی"
  position: "کبھی کبھار تفتیش کار، بلا معاوضہ"
  startdate: 1888-09-01
  enddate: 1888-11-30
  location: "لندن، انگلستان"
  active: false
  notes: "مختصر، غیر سرکاری شمولیت؛ معیاری ریکارڈ سے خارج رکھی گئی"
  summary: >-
    علاقے میں عوامی تشویش کے ایک بڑھے ہوئے دور کے دوران مقدماتی فائلوں کے جائزے میں کبھی کبھار غیر سرکاری معاونت فراہم کی۔
